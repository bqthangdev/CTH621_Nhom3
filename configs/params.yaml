# CTH621 Pipeline Configuration
# ALL hyperparameters live here — NEVER hardcode in Python files
# Shared across all team members via version control

# ============================================================
# Global Settings
# ============================================================
random_state: 42
base_output_dir: "outputs"
base_data_dir: "data"
log_level: "INFO"

# Experiment tracking — set provider to "wandb", "mlflow", or "none"
tracking:
  provider: "none"           # "wandb" | "mlflow" | "none"
  wandb_project: "CTH621"
  mlflow_tracking_uri: "http://localhost:5000"

# ============================================================
# Data Validation Thresholds
# ============================================================
validation:
  group_a:
    min_samples: 100
    min_features: 5
  group_b:
    min_samples: 500
  group_c:
    image:
      min_samples: 500
      min_width: 256
      min_height: 256
    audio:
      min_samples: 200
    video:
      min_samples: 50
    text:
      min_samples: 1000

# ============================================================
# EDA Settings
# ============================================================
eda:
  normalization: "min-max"   # "min-max" or "z-score"
  outlier_method: "iqr-cap"  # "iqr-cap" or "remove"
  iqr_multiplier: 1.5
  group_b_transforms:
    - "forward_fill"
    - "linear_interpolation"
  # Uncomment to enable optional transforms:
  # - "differencing"
  # - "log_transform"

# ============================================================
# Classification
# ============================================================
classification:
  test_size: 0.2
  stratify: true
  cv_n_splits: 5               # K cho StratifiedKFold CV (chạy song song với Hold-out)
  algorithms:
    logistic:
      max_iter: 1000
      C: 1.0                 # nghịch đảo độ mạnh regularization — nhỏ → regularize mạnh hơn
      solver: "lbfgs"        # lbfgs | saga | liblinear | newton-cg | sag
      tol: 0.0001
      class_weight: null     # null | "balanced" — dùng "balanced" nếu imbalanced data
    decision_tree:
      max_depth: 5           # giới hạn độ sâu cây — lớn → overfit
      min_samples_split: 10  # số mẫu tối thiểu để split node
      min_samples_leaf: 4    # số mẫu tối thiểu ở lá — lớn → regularize
      criterion: "gini"      # gini | entropy | log_loss
      max_features: null     # null (toàn bộ) | "sqrt" | "log2" | int
      class_weight: null     # null | "balanced"
    svm:
      C: 1.0                 # penalty trên lỗi phân lớp — lớn → fit sát hơn
      kernel: "rbf"          # linear | poly | rbf | sigmoid
      gamma: "scale"         # scale | auto | float — ảnh hưởng bán kính RBF kernel
      degree: 3              # bậc polynomial — chỉ dùng khi kernel = "poly"
      class_weight: null     # null | "balanced"
      probability: false     # true → bật predict_proba (chậm hơn do cross-validation)
    random_forest:
      n_estimators: 100      # số cây — nhiều hơn thường tốt hơn nhưng chậm hơn
      max_depth: 10          # độ sâu tối đa mỗi cây
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"   # sqrt | log2 | int | float — số feature xét mỗi lần split
      criterion: "gini"      # gini | entropy | log_loss
      class_weight: null     # null | "balanced" | "balanced_subsample"
      n_jobs: -1             # dùng toàn bộ CPU (-1)
      oob_score: false       # true → tính OOB accuracy sau khi train
    gradient_boosting:
      n_estimators: 100
      max_depth: 3           # cây nông tốt hơn cho boosting (tránh overfit)
      learning_rate: 0.1     # bước học — nhỏ hơn + nhiều cây thường cho kết quả tốt hơn
      subsample: 0.8         # tỉ lệ mẫu train mỗi cây — < 1.0 → stochastic GB
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: null     # null | "sqrt" | "log2"
      n_iter_no_change: null # int → early stopping; null = tắt
      validation_fraction: 0.1  # tỉ lệ val dùng cho early stopping
      tol: 0.0001
    knn:
      n_neighbors: 5         # K — nhỏ → fit sát, lớn → mượt hơn
      weights: "uniform"     # uniform | distance (distance → gần hơn có trọng số cao hơn)
      metric: "minkowski"    # minkowski | euclidean | manhattan | cosine
      p: 2                   # 1 = Manhattan, 2 = Euclidean (khi metric = minkowski)
      algorithm: "auto"      # auto | ball_tree | kd_tree | brute
      leaf_size: 30
      n_jobs: -1
    naive_bayes:
      var_smoothing: 1.0e-9  # phương sai làm trơn — tăng nếu bị zero-probability

# ============================================================
# Regression (Time Series — NO random split)
# ============================================================
regression:
  train_ratio: 0.8           # Chronological split — 80% earliest data
  lags: [1, 7, 14]
  rolling_windows: [7, 30]
  cv_n_splits: 5             # K cho TimeSeriesSplit CV (chạy song song với Chronological Split)
  algorithms:
    linear_regression:
      fit_intercept: true    # false → mô hình không có intercept (dùng khi dữ liệu đã chuẩn hóa)
    arima:
      order: [1, 1, 1]       # (p, d, q): AR order, differencing, MA order
      seasonal_order: [0, 0, 0, 0]  # (P, D, Q, s): set s>0 để bật SARIMA
    xgboost:
      n_estimators: 200
      max_depth: 6           # độ sâu cây — lớn → overfit
      learning_rate: 0.05    # eta — nhỏ hơn + nhiều cây = tốt hơn (nhưng chậm)
      subsample: 0.8         # tỉ lệ mẫu mỗi cây
      colsample_bytree: 0.8  # tỉ lệ feature mỗi cây
      early_stopping_rounds: 20
      min_child_weight: 1    # tổng hessian tối thiểu trong lá — lớn → regularize
      gamma: 0               # min gain để split node — lớn → cây đơn giản hơn
      reg_alpha: 0           # L1 regularization trên trọng số lá
      reg_lambda: 1          # L2 regularization trên trọng số lá
    ridge:
      alpha: 1.0             # hệ số L2 — lớn → underfitting, nhỏ → overfitting
      fit_intercept: true
      solver: "auto"         # auto | svd | cholesky | lsqr | sparse_cg | sag | saga
      tol: 0.001
    lasso:
      alpha: 0.1             # hệ số L1 — lớn → nhiều feature bị zeroed out (feature selection)
      max_iter: 2000
      fit_intercept: true
      tol: 0.0001
      selection: "cyclic"    # cyclic | random (random nhanh hơn với dataset lớn)
    random_forest_regressor:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"   # sqrt | log2 | int | float | 1.0
      criterion: "squared_error"  # squared_error | absolute_error | friedman_mse | poisson
      n_jobs: -1
      oob_score: false
    svr:
      C: 1.0                 # penalty — lớn → fit sát, nhỏ → margin rộng hơn
      kernel: "rbf"          # linear | poly | rbf | sigmoid
      epsilon: 0.1           # chiều rộng vùng không phạt (epsilon-tube) — lớn → ít SV hơn
      gamma: "scale"         # scale | auto | float — ảnh hưởng bán kính RBF
      degree: 3              # bậc polynomial — chỉ dùng khi kernel = "poly"
      tol: 0.001

# ============================================================
# Clustering
# ============================================================
clustering:
  scaler: "standard"              # "standard" | "minmax"
  cv_n_splits: 5                  # Số vòng subsampling CV để đánh giá độ ổn định silhouette
  # ── K-Means ──────────────────────────────────────────────────────────────
  max_k: 10                       # duyệt K từ 2 → max_k để tìm K tối ưu
  kmeans_init: "k-means++"        # k-means++ (tốt hơn) | random
  kmeans_n_init: 10               # số lần chạy lại với centroid khởi đầu khác nhau
  kmeans_max_iter: 300            # vòng lặp tối đa mỗi lần chạy
  # ── Hierarchical ─────────────────────────────────────────────────────────
  n_clusters: 3
  linkage_method: "ward"          # ward | complete | average | single
  hierarchical_metric: "euclidean" # euclidean | cosine | manhattan (ward chỉ dùng euclidean)
  # ── DBSCAN ───────────────────────────────────────────────────────────────
  dbscan_eps: 0.5                 # bán kính vùng lân cận — nhỏ → nhiều outlier
  dbscan_min_samples: 5           # số điểm tối thiểu để tạo cụm — lớn → nhiều outlier
  dbscan_metric: "euclidean"      # euclidean | cosine | manhattan
  # ── Gaussian Mixture Model ───────────────────────────────────────────────
  gmm_n_components: 3
  gmm_covariance_type: "full"     # full | tied | diag | spherical
  gmm_max_iter: 100               # vòng lặp EM tối đa
  gmm_n_init: 3                   # số lần khởi tạo ngẫu nhiên — nhiều hơn → ổn định hơn
  gmm_tol: 0.001                  # ngưỡng hội tụ log-likelihood

# ============================================================
# Dataset-Specific Configurations
#
# Cấu trúc mỗi dataset:
#   <dataset_name>:
#     type: "A" | "B" | "C"
#     file: "data/raw/..."
#
#     <task>:               # classification | regression | clustering
#       # --- Task-level params (override global nếu khai báo) ---
#       test_size: 0.15        # classification: override global test_size
#       train_ratio: 0.85      # regression:     override global train_ratio
#       lags: [1, 5, 10]       # regression:     override global lags
#       rolling_windows: [5, 20] # regression:   override global rolling_windows
#       max_k: 8               # clustering:     override global max_k
#       n_clusters: 4          # clustering:     override global n_clusters
#       dbscan_eps: 0.3        # clustering:     override global dbscan_eps
#
#       # --- Algorithm selection (OPTIONAL) ---
#       algorithms:            # Nếu KHÔNG khai báo → dùng toàn bộ global algorithms
#         <algo_name>:         # Nếu CÓ → CHỈ chạy các algo được liệt kê ở đây
#           <param>: <value>   # Dataset params OVERRIDE global (shallow merge)
#
# Priority (cao → thấp):
#   1. CLI --algo   → chỉ chạy 1 algo đó, bất kể config
#   2. datasets[name][task].algorithms → chỉ chạy algo khai báo
#   3. Global [task].algorithms → fallback, chạy tất cả
# ============================================================
datasets:

  # ── Group A: Dữ liệu dạng bảng ──────────────────────────────────────────
  healthcare_dataset_stroke:
    type: "A"
    file: "data/raw/tabular/healthcare_dataset_stroke/healthcare-dataset-stroke-data.csv"
    drop_columns: ["id"]           # Cột định danh — loại bỏ trước khi xử lý
    encode_categoricals: true      # One-hot encode các cột object trước khi lưu parquet
    protect_columns: ["stroke", "hypertension", "heart_disease"]  # Không cap/normalize target columns
    classification:
      target_columns: ["stroke", "hypertension", "heart_disease"]
      test_size: 0.2
      stratify: true
      cv_n_splits: 5
      algorithms:
        logistic:
          C: 0.1                   # Regularize mạnh hơn do số feature sau encode tăng
          max_iter: 3000
          solver: "lbfgs"
          class_weight: "balanced" # BẮT BUỘC — stroke chỉ chiếm 4.8%
        decision_tree:
          max_depth: 6
          min_samples_split: 20
          min_samples_leaf: 10
          class_weight: "balanced"
        random_forest:
          n_estimators: 200
          max_depth: 8
          min_samples_leaf: 5
          n_jobs: -1
          class_weight: "balanced"
        gradient_boosting:
          n_estimators: 150
          max_depth: 4
          learning_rate: 0.05
          subsample: 0.8
          n_iter_no_change: 10
    clustering:
      label_columns: ["stroke", "hypertension", "heart_disease"]
      max_k: 8
      n_clusters: 3
      dbscan_eps: 1.5              # Không gian sau one-hot rộng hơn — eps lớn hơn
      dbscan_min_samples: 10

  neurofibromatosis:
    type: "A"
    file: "data/raw/tabular/neurofibromatosis/neurofibromatosis.csv"
    # Không có cột định danh cần drop
    # Không có cột object — không cần encode_categoricals
    protect_columns: ["Case Type", "Tumour Case"]  # 2 target binary — không cap/normalize
    classification:
      target_columns: ["Case Type", "Tumour Case"]
      test_size: 0.2
      stratify: true
      cv_n_splits: 5               # Dataset nhỏ (295 mẫu) — giảm xuống 5 fold
      algorithms:
        logistic:
          C: 1.0
          max_iter: 2000
          solver: "lbfgs"
          class_weight: "balanced" # Tumour Case imbalance: 214 vs 81
        decision_tree:
          max_depth: 5             # Cây nông vì dataset nhỏ — tránh overfit
          min_samples_split: 10
          min_samples_leaf: 5
          class_weight: "balanced"
        random_forest:
          n_estimators: 200
          max_depth: 6
          min_samples_leaf: 3
          n_jobs: -1
          class_weight: "balanced"
        gradient_boosting:
          n_estimators: 100
          max_depth: 3
          learning_rate: 0.1
          subsample: 0.8
    clustering:
      label_columns: ["Case Type", "Tumour Case"]
      max_k: 6                     # Dataset nhỏ — giới hạn max_k
      n_clusters: 2                # Dự kiến 2 nhóm (Case Type có 2 giá trị)
      dbscan_eps: 0.8
      dbscan_min_samples: 5

  # Group A: additional tabular datasets
  higher_education_predictors_of_student_retention:
    type: "A"
    file: "data/raw/tabular/higher_education_predictors_of_student_retention/dataset.csv"
    encode_categoricals: false
    protect_columns: ["Target"]
    classification:
      target_columns: ["Target"]
      test_size: 0.2
      stratify: true
      cv_n_splits: 5
      algorithms:
        logistic:
          C: 1.0
          max_iter: 3000
          solver: "lbfgs"
          class_weight: "balanced"
        decision_tree:
          max_depth: 8
          min_samples_split: 20
          min_samples_leaf: 8
          class_weight: "balanced"
        random_forest:
          n_estimators: 200
          max_depth: 12
          min_samples_leaf: 4
          n_jobs: 1
          class_weight: "balanced"
        gradient_boosting:
          n_estimators: 150
          max_depth: 3
          learning_rate: 0.05
          subsample: 0.8
        knn:
          n_neighbors: 7
          weights: "distance"
    clustering:
      label_columns: ["Target"]
      max_k: 8
      n_clusters: 3
      dbscan_eps: 3.0
      dbscan_min_samples: 10

  # ── Group B: Dữ liệu chuỗi thời gian ────────────────────────────────────
  pgcb_hourly_generation:
    type: "B"
    file: "data/raw/timeseri/pgcb_hourly_generation/PGCB_date_power_demand.csv"
    datetime_col: "datetime"
    target_col: "generation_mw"    # Dự báo tổng công suất phát điện (MW)
    drop_columns: ["remarks"]      # Cột text tự do — loại bỏ trước khi xử lý
    regression:
      train_ratio: 0.85
      lags: [1, 24, 48, 168]       # 1h, 1 ngày, 2 ngày, 1 tuần trước (dữ liệu hourly)
      rolling_windows: [24, 168]   # Rolling 24h và 7 ngày
      cv_n_splits: 5
      algorithms:
        linear_regression:
          fit_intercept: true
        xgboost:
          n_estimators: 200
          max_depth: 5
          learning_rate: 0.05
          subsample: 0.8
          colsample_bytree: 0.8
          early_stopping_rounds: 20
          min_child_weight: 3      # Tránh overfit vì dữ liệu nhiễu
          reg_lambda: 1.5
        ridge:
          alpha: 10.0              # Alpha lớn hơn vì nhiều lag features — regularize mạnh
          fit_intercept: true
          solver: "auto"
        random_forest_regressor:
          n_estimators: 100
          max_depth: 8
          min_samples_leaf: 10     # Lá lớn hơn — dữ liệu hourly có noise cao
          n_jobs: -1
    clustering:
      label_columns: []
      max_k: 8
      n_clusters: 4                # Dự kiến 4 cụm (mùa: xuân/hè/thu/đông)
      dbscan_eps: 0.6
      dbscan_min_samples: 20       # Dữ liệu dày — cần min_samples lớn hơn

  har70plus:
    type: "B"
    file: "data/raw/timeseri/har70plus/har70plus_merged.csv"  # Đã merge 18 subject
    datetime_col: "timestamp"
    target_col: "back_x"           # Hồi quy tín hiệu gia tốc lưng (back accelerometer)
    drop_columns: ["subject_id"]   # Metadata — không dùng làm feature
    regression:
      train_ratio: 0.8
      lags: [1, 5, 10, 20, 50]     # Sampling ~50Hz — lags ngắn hơn
      rolling_windows: [10, 50, 200]
      cv_n_splits: 5
      algorithms:
        linear_regression:
          fit_intercept: true
        ridge:
          alpha: 1.0
          fit_intercept: true
        lasso:
          alpha: 0.01              # Lasso nhỏ vì tín hiệu gia tốc có nhiều feature quan trọng
          max_iter: 3000
        xgboost:
          n_estimators: 150
          max_depth: 5
          learning_rate: 0.1
          subsample: 0.8
          colsample_bytree: 0.8
    clustering:
      label_columns: ["label"]     # label: 1=đi bộ,3=đứng,4=ngồi,5=nằm,6=cúi,7=leo cầu thang,8=đứng yên
      max_k: 8
      n_clusters: 7                # 7 hoạt động khác nhau trong dataset
      dbscan_eps: 0.5
      dbscan_min_samples: 100      # Dataset rất lớn (2.2M rows) — min_samples cao

  # Group B: additional time-series datasets
  dow_jones_index:
    type: "B"
    file: "data/raw/timeseri/dow_jones_index/dow_jones_index.data"
    datetime_col: "date"
    target_col: "percent_change_next_weeks_price"
    drop_columns:
      - "stock"
      - "open"
      - "high"
      - "low"
      - "close"
      - "next_weeks_open"
      - "next_weeks_close"
    regression:
      train_ratio: 0.8
      lags: [1, 2, 4]
      rolling_windows: [2, 4]
      cv_n_splits: 5
      algorithms:
        linear_regression:
          fit_intercept: true
        ridge:
          alpha: 1.0
          fit_intercept: true
        lasso:
          alpha: 0.01
          max_iter: 3000
        random_forest_regressor:
          n_estimators: 100
          max_depth: 6
          min_samples_leaf: 5
          n_jobs: 1
        xgboost:
          n_estimators: 100
          max_depth: 3
          learning_rate: 0.05
          subsample: 0.8
          colsample_bytree: 0.8
          early_stopping_rounds: 10
    clustering:
      label_columns: ["percent_change_next_weeks_price"]
      max_k: 8
      n_clusters: 4
      dbscan_eps: 1.2
      dbscan_min_samples: 10

  # ── Group C: Dữ liệu đa phương tiện ─────────────────────────────────────
  # Group C: multimedia datasets
  realwaste:
    type: "C"
    subtype: "image"
    dir: "data/raw/images/realwaste-main/RealWaste"  # 9 lớp rác thải: Cardboard/Glass/Metal/...
    clustering:
      label_columns: ["label"]
      max_k: 10
      n_clusters: 9                # 9 lớp rác thải — khớp với số thư mục
      dbscan_eps: 0.5
      dbscan_min_samples: 5

  heartbeat_sounds:
    type: "C"
    subtype: "audio"
    dir: "data/raw/audio/heartbeat_sounds"
    metadata_files:
      - "data/raw/audio/heartbeat_sounds/set_a.csv"
      - "data/raw/audio/heartbeat_sounds/set_b.csv"
    clustering:
      label_columns: ["dataset", "fname", "path", "label", "sublabel"]
      max_k: 8
      n_clusters: 4
      dbscan_eps: 0.5
      dbscan_min_samples: 5
